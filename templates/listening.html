{% extends "base.html" %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/listening.css') }}">
{% endblock %}

{% block content %}

    <div class="container">

        <div class="title">

            <h1>🎧 Listening Mode</h1>

            <p>
                Select your mood, preferred listening time and purpose.
                RaagaSetu will recommend the most suitable Indian Classical Raga.
            </p>

        </div>

        <div class="card">

            <form action="/recommend" method="POST">

                <div class="form-group">

                    <label>😊 Select Mood</label>

                    <select name="mood" required>

                        <option value="">Choose Mood</option>

                        <option value="Calm">😌 Calm</option>

                        <option value="Happy">😊 Happy</option>

                        <option value="Spiritual">🙏 Spiritual</option>

                        <option value="Sad">😔 Sad</option>

                    </select>

                </div>

                <div class="form-group">

                    <label>🕒 Select Time</label>

                    <select name="time" required>

                        <option value="">Choose Time</option>

                        <option value="Morning">🌅 Morning</option>

                        <option value="Afternoon">☀ Afternoon</option>

                        <option value="Evening">🌇 Evening</option>

                        <option value="Night">🌙 Night</option>

                    </select>

                </div>

                <div class="form-group">

                    <label>🎯 Purpose</label>

                    <select name="purpose" required>

                        <option value="">Choose Purpose</option>

                        <option value="Study">📚 Study</option>

                        <option value="Relaxation">😌 Relaxation</option>

                        <option value="Meditation">🧘 Meditation</option>

                        <option value="Practice">🎼 Practice</option>

                    </select>

                </div>

                <button type="submit">
                    🎵 Recommend Raga
                </button>

            </form>

            <a href="/" class="back-btn">
                ⬅ Back to Home
            </a>

        </div>

    </div>

{% endblock %}
